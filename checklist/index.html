<h1>Review checklist</h1>
<p class="prose meta">Generated from the reference sections of each topic page by <code>tools/build_checklist.py</code>. Do not edit this file by hand. 52 items, sorted by severity. Ticks are not saved.</p>
<ul class="checks">
<li><label><input type="checkbox"><span><strong>The verifier selects the algorithm from its own allowlist, never from the token header</strong><span class="sev Critical">Critical</span><br><span class="meta">Test a token with alg set to none and one downgraded to HS256 and signed with the issuer&#x27;s public key. Both must be rejected. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The audience is validated against this service&#x27;s own identifier</strong><span class="sev Critical">Critical</span><br><span class="meta">A genuine token issued for a sibling service in the same estate is rejected. A missing aud is rejected. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The signing key comes from the issuer&#x27;s published key set, selected by kid</strong><span class="sev Critical">Critical</span><br><span class="meta">The verifier never fetches a key named by jku or x5u in the token header. An unknown kid is rejected. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Key validation is followed by permission checks</strong><span class="sev Critical">Critical</span><br><span class="meta">Test denied actions and cross-caller resources with an otherwise valid credential. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Signed M2M requests cover method, host, path, query, timestamp, nonce, and the raw body hash</strong><span class="sev Critical">Critical</span><br><span class="meta">The canonical format is documented, and both parties test against shared examples. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The receiver hashes the raw body bytes it received</strong><span class="sev Critical">Critical</span><br><span class="meta">It never re-serializes parsed JSON, and never trusts a caller-supplied hash. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Public clients use the authorization code grant with PKCE S256</strong><span class="sev Critical">Critical</span><br><span class="meta">The server records the challenge and method at the authorization request and verifies against the recorded method, not one supplied at redemption. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Redirect URIs are matched by exact string comparison</strong><span class="sev Critical">Critical</span><br><span class="meta">No prefix, wildcard, or substring matching. Localhost port numbers for native apps are the only documented exception. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The implicit and password grants are disabled at the authorization server</strong><span class="sev Critical">Critical</span><br><span class="meta">Test that response_type=token and grant_type=password return errors. Existing integrations that use them have a dated migration plan. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every key set refresh outcome has a documented, tested answer</strong><span class="sev Critical">Critical</span><br><span class="meta">Success with keys, success with zero keys, malformed, non-success status, and transport failure. State which are authoritative and which keep the last known good set. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A key removed by the issuer stops verifying without a restart</strong><span class="sev Critical">Critical</span><br><span class="meta">A scheduled refresh exists, not only a refresh on unknown kid. Test rotation out as well as rotation in. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The verifying key is never fetched from a location named in the token</strong><span class="sev Critical">Critical</span><br><span class="meta">jku and x5u in the header change nothing. Key locations come from configuration or issuer metadata. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A bound token without its proof or certificate is rejected, never downgraded</strong><span class="sev Critical">Critical</span><br><span class="meta">No fall back to bearer behaviour when the binding material is missing, including when a proxy strips the client certificate. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The proof key thumbprint is compared with the token&#x27;s cnf claim</strong><span class="sev Critical">Critical</span><br><span class="meta">A valid proof from any other key is rejected. For certificate binding, the certificate comes from the TLS layer, not a header, unless that header is proven unsettable. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Proof replay is prevented by recording jti across all instances</strong><span class="sev Critical">Critical</span><br><span class="meta">Recorded only after every other check passes. A shared store, not per-instance memory. Test replay against a second instance. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A body digest is a covered component and is recomputed on every request</strong><span class="sev Critical">Critical</span><br><span class="meta">Both halves. Test a swapped body against a request whose digest is covered, and against one where it is present but uncovered. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>keyid resolves only to keys held out of band</strong><span class="sev Critical">Critical</span><br><span class="meta">No fetching from a caller-supplied location. An unknown keyid is rejected, not resolved. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The algorithm is checked against an allowlist and against the key</strong><span class="sev Critical">Critical</span><br><span class="meta">A valid signature with a disallowed algorithm is rejected. A message claiming a symmetric algorithm for an asymmetric key is rejected. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The token profile is declared, and every required claim is checked for presence before use</strong><span class="sev High">High</span><br><span class="meta">Name the profile, such as RFC 9068 for OAuth access tokens. A token missing any required claim is rejected rather than defaulted. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Different kinds of JWT from the same issuer have mutually exclusive validation rules</strong><span class="sev High">High</span><br><span class="meta">An ID token is rejected where an access token is expected, and the reverse. Token type or an equivalent claim is checked. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Issuer and time claims are validated with a documented leeway</strong><span class="sev High">High</span><br><span class="meta">iss matches exactly, the key belongs to that issuer, and exp, nbf and iat are checked against server time. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Credentials stay out of URLs and telemetry</strong><span class="sev High">High</span><br><span class="meta">Reject query credentials and test every logging layer with generated test values, including failure paths. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Exposed keys can be revoked everywhere</strong><span class="sev High">High</span><br><span class="meta">Measure the revocation bound across caches and confirm the old key fails while its replacement works. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Keys have secure generation, storage, ownership, and expiry</strong><span class="sev High">High</span><br><span class="meta">Keep separate records per caller and environment; the caller retrieves the secret from a secrets manager. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Transport and credential parsing are tested end to end</strong><span class="sev High">High</span><br><span class="meta">Require HTTPS, certificate validation, and consistent rejection of missing or ambiguous credentials. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Timestamps are bounded and nonces are rejected on reuse</strong><span class="sev High">High</span><br><span class="meta">The nonce is recorded only after the signature verifies. The cache TTL is at least the time window. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Signatures are compared in constant time</strong><span class="sev High">High</span><br><span class="meta">Use a library function built for this, not string equality. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Keys are per partner, at least 32 bytes, and rotated with an overlap</strong><span class="sev High">High</span><br><span class="meta">Both sides store keys in a secrets manager. Retired keys are rejected after the overlap ends. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Authorization codes are single use, short lived, and bound to client and redirect URI</strong><span class="sev High">High</span><br><span class="meta">A second redemption is denied and revokes tokens already issued from that code. Test the replay path, not just the happy path. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Resource servers validate the token audience and the scope for the operation</strong><span class="sev High">High</span><br><span class="meta">A token issued for one resource server is rejected by another. A valid token is not permission for every operation its scope touches. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Service-to-service clients have their own identity, narrow scopes, and no refresh token</strong><span class="sev High">High</span><br><span class="meta">One registration per service and environment. The client secret or key comes from an approved runtime secret mechanism. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>An unknown kid cannot drive a fetch storm</strong><span class="sev High">High</span><br><span class="meta">One bounded refresh, concurrent misses coalesced, a cooldown enforced. Test with a stream of invented key identifiers. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A kid matching more than one eligible key is rejected as ambiguous</strong><span class="sev High">High</span><br><span class="meta">No selection by array order. Keys are also filtered by use and by the algorithms the profile allows. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The revocation bound is documented as a sum and measured end to end</strong><span class="sev High">High</span><br><span class="meta">Token lifetime plus key cache age plus introspection cache TTL plus any gateway cache. Disable an account and time how long requests keep succeeding. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Proofs are bound to the request and the token</strong><span class="sev High">High</span><br><span class="meta">htm, htu and ath are all checked. Test a proof from a different endpoint and a proof paired with a different token. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The proof time window is short and documented</strong><span class="sev High">High</span><br><span class="meta">Stated in seconds, enforced in both directions, and understood as the replay window for anything not recorded. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Client private keys are stored at least as well as the tokens they replace</strong><span class="sev High">High</span><br><span class="meta">Non-exportable or hardware-backed where the platform allows. Binding converts token theft into key theft. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every component the handler trusts is covered</strong><span class="sev High">High</span><br><span class="meta">Method, authority, path, content type, body digest, and the query where it carries meaning. Anything uncovered is treated as untrusted in the code, not just in the design document. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A covered component missing from the message is a rejection</strong><span class="sev High">High</span><br><span class="meta">The verifier does not substitute a blank value to complete the base. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Freshness and replay are both bounded</strong><span class="sev High">High</span><br><span class="meta">created is inside a stated window, expires is enforced when present, and nonce is recorded after verification in a store shared across instances. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Rejection responses do not say which check failed</strong><span class="sev Medium">Medium</span><br><span class="meta">Callers get 401. The specific reason is logged internally with a correlation ID. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Library defaults have been read, not assumed</strong><span class="sev Medium">Medium</span><br><span class="meta">Confirm what your JWT library validates by default, and configure algorithms, audience and issuer explicitly. Test the negative cases against your own configuration. Source: <a href="../topics/jwt-validation/index.html#reference">A JWT verifier taking a declared profile and an untrusted token</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Intermediaries do not alter signed components</strong><span class="sev Medium">Medium</span><br><span class="meta">Gateway and proxy behavior is tested with signed requests end to end. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The shared-secret limitation is accepted in the threat model</strong><span class="sev Medium">Medium</span><br><span class="meta">Otherwise use asymmetric request signatures. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>An access token is never treated as proof of user identity</strong><span class="sev Medium">Medium</span><br><span class="meta">Sign-in uses standardized user authentication. ID tokens are not sent to resource servers, and access tokens do not create sessions. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Token endpoint errors use the defined codes and leak nothing else</strong><span class="sev Medium">Medium</span><br><span class="meta">Responses do not reveal which check failed, whether a client exists, or whether a code was valid but expired. Source: <a href="../topics/oauth-basics/index.html#reference">Front channel and back channel in an authorization code flow with PKCE</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Introspection caching states its blind window</strong><span class="sev Medium">Medium</span><br><span class="meta">A cached response is not used beyond its exp. The window during which a revoked token still works is written down and accepted. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Key set retrieval is over TLS with certificate validation, and failures are alerted</strong><span class="sev Medium">Medium</span><br><span class="meta">A key endpoint that has been unreachable for longer than the maximum age is a security event, not just a latency blip. Source: <a href="../topics/jwks-and-revocation/index.html#reference">Key resolution through a cache, then an active-state check</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Binding has not displaced any existing check</strong><span class="sev Medium">Medium</span><br><span class="meta">Audience, scope, expiry, issuer and object-level authorization are all still enforced on bound tokens. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The revocation bound is unchanged and still stated</strong><span class="sev Medium">Medium</span><br><span class="meta">A bound token remains valid until it expires unless active state is consulted. Module 6&#x27;s sum still applies. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Two ways to bind a token to its holder</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Key rotation works without a cutover</strong><span class="sev Medium">Medium</span><br><span class="meta">A new keyid per key, both accepted during an overlap, and the retirement date recorded. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The choice of symmetric or asymmetric is written down with its reason</strong><span class="sev Medium">Medium</span><br><span class="meta">If an HMAC is still in use, the threat model states that a breached receiver forging as the caller is accepted. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Where the signing capability sits, with a shared secret and with a keypair</a>.</span></span></label></li>
</ul>
