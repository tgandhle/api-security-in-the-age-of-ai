<h1>Review checklist</h1>
<p class="prose meta">Generated from the reference sections of each topic page by <code>tools/build_checklist.py</code>. Do not edit this file by hand. 12 items, sorted by severity. Ticks are not saved.</p>
<ul class="checks">
<li><label><input type="checkbox"><span><strong>Key validation is followed by permission checks</strong><span class="sev Critical">Critical</span><br><span class="meta">Test denied actions and cross-caller resources with an otherwise valid credential. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Signed M2M requests cover method, host, path, query, timestamp, nonce, and the raw body hash</strong><span class="sev Critical">Critical</span><br><span class="meta">The canonical format is documented, and both parties test against shared examples. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The receiver hashes the raw body bytes it received</strong><span class="sev Critical">Critical</span><br><span class="meta">It never re-serializes parsed JSON, and never trusts a caller-supplied hash. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Credentials stay out of URLs and telemetry</strong><span class="sev High">High</span><br><span class="meta">Reject query credentials and test every logging layer with generated test values, including failure paths. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Exposed keys can be revoked everywhere</strong><span class="sev High">High</span><br><span class="meta">Measure the revocation bound across caches and confirm the old key fails while its replacement works. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Keys have secure generation, storage, ownership, and expiry</strong><span class="sev High">High</span><br><span class="meta">Keep separate records per caller and environment; the caller retrieves the secret from a secrets manager. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Transport and credential parsing are tested end to end</strong><span class="sev High">High</span><br><span class="meta">Require HTTPS, certificate validation, and consistent rejection of missing or ambiguous credentials. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Timestamps are bounded and nonces are rejected on reuse</strong><span class="sev High">High</span><br><span class="meta">The nonce is recorded only after the signature verifies. The cache TTL is at least the time window. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Signatures are compared in constant time</strong><span class="sev High">High</span><br><span class="meta">Use a library function built for this, not string equality. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Keys are per partner, at least 32 bytes, and rotated with an overlap</strong><span class="sev High">High</span><br><span class="meta">Both sides store keys in a secrets manager. Retired keys are rejected after the overlap ends. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Intermediaries do not alter signed components</strong><span class="sev Medium">Medium</span><br><span class="meta">Gateway and proxy behavior is tested with signed requests end to end. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The shared-secret limitation is accepted in the threat model</strong><span class="sev Medium">Medium</span><br><span class="meta">Otherwise use asymmetric request signatures. Source: <a href="../topics/hmac-request-signing/index.html#reference">Architecture of an HMAC-signed points transfer</a>.</span></span></label></li>
</ul>
