<h1>Review checklist</h1>
<p class="prose meta">Generated from the reference sections of each topic page by <code>tools/build_checklist.py</code>. Do not edit this file by hand. 215 items, sorted by severity. Ticks are not saved.</p>
<ul class="checks">
<li><label><input type="checkbox"><span><strong>Key validation is followed by permission checks</strong><span class="sev Critical">Critical</span><br><span class="meta">Test denied actions and cross-caller resources with an otherwise valid credential. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Approvals bind the parameters, not a proposal identifier</strong><span class="sev Critical">Critical</span><br><span class="meta">Otherwise the executor&#x27;s second read of a mutable store decides what runs, and the approval is for an id that still exists. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every field that changes the outcome is inside the coverage</strong><span class="sev Critical">Critical</span><br><span class="meta">Proven by changing each field in turn and confirming the approval stops verifying. The destination is the one most often left out. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The approver&#x27;s summary is derived from the covered fields</strong><span class="sev Critical">Critical</span><br><span class="meta">A summary built separately can stay identical while a field outside it changes where the money goes. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Agent cards are verified against an out-of-band key per counterparty</strong><span class="sev Critical">Critical</span><br><span class="meta">Not against a key the card names or the serving domain supplies. A forged card signed with the forger&#x27;s own key verifies perfectly. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Credentials never travel inside a task conversation</strong><span class="sev Critical">Critical</span><br><span class="meta">The documented flow puts secondary credential acquisition outside the protocol. A request to deliver one in-band is a finding. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Client-supplied webhook URLs are allowlisted and address-checked</strong><span class="sev Critical">Critical</span><br><span class="meta">A name check and an address check are different checks. The A2A documentation says servers should not POST blindly to any URL a client provides. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Inbound notifications are verified on signature, freshness and task token</strong><span class="sev Critical">Critical</span><br><span class="meta">And on an identifier, so a replay is handled once. The webhook URL should be treated as public. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A body digest is a covered component and is recomputed on every request</strong><span class="sev Critical">Critical</span><br><span class="meta">Both halves. Test a swapped body against a request whose digest is covered, and against one where it is present but uncovered. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>keyid resolves only to keys held out of band</strong><span class="sev Critical">Critical</span><br><span class="meta">No fetching from a caller-supplied location. An unknown keyid is rejected, not resolved. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The algorithm is checked against an allowlist and against the key</strong><span class="sev Critical">Critical</span><br><span class="meta">A valid signature with a disallowed algorithm is rejected. A message claiming a symmetric algorithm for an asymmetric key is rejected. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every non-idempotent operation with a real effect accepts an idempotency key</strong><span class="sev Critical">Critical</span><br><span class="meta">Payments, credits, orders, messages, anything with a cost. Test that the same request twice applies once. Source: <a href="../topics/business-flows-and-idempotency/index.html#reference">Business flows and idempotency</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The key is reserved before the work, not recorded after it</strong><span class="sev Critical">Critical</span><br><span class="meta">Test two copies arriving before the first completes. The second is refused, not executed. Source: <a href="../topics/business-flows-and-idempotency/index.html#reference">Business flows and idempotency</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Sensitive business flows have a written rate and quantity limit</strong><span class="sev Critical">Critical</span><br><span class="meta">Produced by someone who knows what the flow costs, enforced across every endpoint that advances it, and proven by a test that ran past it. Source: <a href="../topics/business-flows-and-idempotency/index.html#reference">Business flows and idempotency</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The allowed origin is never taken from the request</strong><span class="sev Critical">Critical</span><br><span class="meta">Test a disallowed origin and a lookalike such as an allowed host with an extra suffix. Both must come back with no Access-Control-Allow-Origin header. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No credentialed response allows a wildcard origin</strong><span class="sev Critical">Critical</span><br><span class="meta">Access-Control-Allow-Origin cannot be * when credentials are included. Assert it on every endpoint that allows credentials, not just the ones you remember. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>State-changing endpoints are protected independently of CORS</strong><span class="sev Critical">Critical</span><br><span class="meta">A safelisted cross-origin POST is sent with no preflight and the server does the work. Anti-forgery tokens and SameSite cookies are what stop it. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No credential appears in any system prompt</strong><span class="sev Critical">Critical</span><br><span class="meta">The system prompt is part of the request payload and reaches every sink. OWASP says to externalize credentials to systems the model does not directly access. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Prompt context is built from a per-task field allowlist</strong><span class="sev Critical">Critical</span><br><span class="meta">Not from a serialised record. A field that never entered the context cannot reach a log, a cache, a provider or the answer. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Responses are filtered by role before returning</strong><span class="sev Critical">Critical</span><br><span class="meta">Deny by default. The model repeats what it was given. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No service forwards a user&#x27;s token outside the audience it was issued for</strong><span class="sev Critical">Critical</span><br><span class="meta">Verified by reading the outbound calls. A forwarded token carries all of the user&#x27;s authority and names no agent. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Calls made on a user&#x27;s behalf carry the user in the token, not in a parameter</strong><span class="sev Critical">Critical</span><br><span class="meta">Otherwise the object check compares against a user ID the caller supplied. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Resource servers authorize on the current actor only</strong><span class="sev Critical">Critical</span><br><span class="meta">RFC 8693 section 4.1 states it as a MUST. Test that a prior actor in a nested chain does not grant access. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Missing information blocks a rule rather than passing it</strong><span class="sev Critical">Critical</span><br><span class="meta">A checklist that passes when it does not know will reliably report that the system is fine. Source: <a href="../topics/design-review/index.html#reference">Design review</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every service authenticates for itself, on every path</strong><span class="sev Critical">Critical</span><br><span class="meta">Tested from a path that does not cross the gateway. A service that only works because the gateway checked is unauthenticated on every other route. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The path list comes from the network and is dated</strong><span class="sev Critical">Critical</span><br><span class="meta">Connection logs, mesh telemetry or firewall rules. A diagram is the claim being tested, not the evidence. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No gateway-injected identity header is trusted without an authenticated connection</strong><span class="sev Critical">Critical</span><br><span class="meta">List every path that can set it. If any path that reaches the service can, the header is caller-supplied. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Signed M2M requests cover method, host, path, query, timestamp, nonce, content type, and the raw body hash</strong><span class="sev Critical">Critical</span><br><span class="meta">The canonical format is documented, and both parties test against shared examples. Source: <a href="../topics/hmac-request-signing/index.html#reference">HMAC request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The receiver hashes the raw body bytes it received</strong><span class="sev Critical">Critical</span><br><span class="meta">It never re-serializes parsed JSON, and never trusts a caller-supplied hash. Source: <a href="../topics/hmac-request-signing/index.html#reference">HMAC request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every key set refresh outcome has a documented, tested answer</strong><span class="sev Critical">Critical</span><br><span class="meta">Success with keys, success with zero keys, malformed, non-success status, and transport failure. State which are authoritative and which keep the last known good set. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A key removed by the issuer stops verifying without a restart</strong><span class="sev Critical">Critical</span><br><span class="meta">A scheduled refresh exists, not only a refresh on unknown kid. Test rotation out as well as rotation in. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The verifying key is never fetched from a location named in the token</strong><span class="sev Critical">Critical</span><br><span class="meta">jku and x5u in the header change nothing. Key locations come from configuration or issuer metadata. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The verifier selects the algorithm from its own allowlist, never from the token header</strong><span class="sev Critical">Critical</span><br><span class="meta">Test a token with alg set to none and one downgraded to HS256 and signed with the issuer&#x27;s public key. Both must be rejected. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The audience is validated against this service&#x27;s own identifier</strong><span class="sev Critical">Critical</span><br><span class="meta">A genuine token issued for a sibling service in the same estate is rejected. A missing aud is rejected. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The signing key comes from the issuer&#x27;s published key set, selected by kid</strong><span class="sev Critical">Critical</span><br><span class="meta">The verifier never fetches a key named by jku or x5u in the token header. An unknown kid is rejected. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The MCP server validates that each token&#x27;s audience is itself</strong><span class="sev Critical">Critical</span><br><span class="meta">Tested with a token your own authorization server issued for another resource, because a shared issuer means the signature check cannot tell them apart. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The inbound token is never forwarded to an upstream API</strong><span class="sev Critical">Critical</span><br><span class="meta">The server holds its own token for the upstream. The specification states MUST NOT for passing the inbound one through. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>An HTTP-transport MCP server requires authorization</strong><span class="sev Critical">Critical</span><br><span class="meta">The specification&#x27;s optionality covers stdio servers reading credentials from the environment, not an unprotected HTTP endpoint. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>State handles are bound server side to the authenticated user</strong><span class="sev Critical">Critical</span><br><span class="meta">Possession of a handle must not be treated as authentication. Test that another caller&#x27;s handle is refused. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Public clients use the authorization code grant with PKCE S256</strong><span class="sev Critical">Critical</span><br><span class="meta">The server records the challenge and method at the authorization request and verifies against the recorded method, not one supplied at redemption. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Redirect URIs are matched by exact string comparison</strong><span class="sev Critical">Critical</span><br><span class="meta">No prefix, wildcard, or substring matching. Localhost port numbers for native apps are the only documented exception. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The implicit and password grants are disabled at the authorization server</strong><span class="sev Critical">Critical</span><br><span class="meta">Test that response_type=token and grant_type=password return errors. Existing integrations that use them have a dated migration plan. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every handler compares the caller with the owner read from the loaded object</strong><span class="sev Critical">Critical</span><br><span class="meta">Quote the line for each object type. A comparison against a value from the request is not a check. Source: <a href="../topics/object-level-authorization/index.html#reference">Object-level authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The check is present on every verb and every path to the object</strong><span class="sev Critical">Critical</span><br><span class="meta">Reads, writes, deletes, bulk exports, and any older API version still serving traffic. One path without it is the vulnerability. Source: <a href="../topics/object-level-authorization/index.html#reference">Object-level authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>List endpoints filter in the query</strong><span class="sev Critical">Critical</span><br><span class="meta">Verified against the query, not the response. Filtering after serialisation or in the client means the data already left. Source: <a href="../topics/object-level-authorization/index.html#reference">Object-level authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Tools are dispatched from a deny-by-default table</strong><span class="sev Critical">Critical</span><br><span class="meta">Keyed on the exact name, with role and arguments validated. A tool absent from the table is refused without anyone having anticipated it. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Tool credentials are held by the application, not the model</strong><span class="sev Critical">Critical</span><br><span class="meta">OWASP&#x27;s wording is to handle these functions in code rather than providing them to the model. A model with a token makes the table advisory. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No SQL is built by interpolation from model output</strong><span class="sev Critical">Critical</span><br><span class="meta">Parameterized queries only. The lab&#x27;s interpolated query returns the entire table on a payload that was supposed to be a city name. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Model output is encoded for each destination at the point of use</strong><span class="sev Critical">Critical</span><br><span class="meta">HTML, shell, URL and SQL need four different treatments. One sanitize function is the pattern to remove. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Updates copy an allowlist of writable fields, never bind the body</strong><span class="sev Critical">Critical</span><br><span class="meta">Send a body containing every field of the record and confirm only the writable ones changed, including is_staff or its equivalent. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every operation has a rule keyed by method and path, and unlisted routes are refused</strong><span class="sev Critical">Critical</span><br><span class="meta">Deny by default. Test an unlisted route and a second verb on a route you do allow. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Administrative functions are identified by what they do, not by their path</strong><span class="sev Critical">Critical</span><br><span class="meta">List them and check each one&#x27;s rule. A prefix rule is not an authorization mechanism. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Counters are held in a store every instance shares</strong><span class="sev Critical">Critical</span><br><span class="meta">Tested by driving traffic through two instances. Local counters multiply the published limit by the instance count. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Repeated names are rejected, not resolved</strong><span class="sev Critical">Critical</span><br><span class="meta">Test a body with one name twice. Any silent resolution is a resolution another parser makes differently. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Limits run before the parser</strong><span class="sev Critical">Critical</span><br><span class="meta">Size, decoded size and nesting depth. A schema runs on an object, and these inputs are the ones that stop an object existing. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Decoded size is bounded during decompression</strong><span class="sev Critical">Critical</span><br><span class="meta">Measured on the bytes produced, with the decoder stopped at the limit. A limit on the bytes received is not this. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>URLs are parsed, and only the host component is checked</strong><span class="sev Critical">Critical</span><br><span class="meta">Test the allowed host as userinfo before an @, inside a fragment, and as a subdomain prefix. All three must be refused. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Resolved addresses are classified against the special-purpose ranges</strong><span class="sev Critical">Critical</span><br><span class="meta">Loopback, link-local, private, reserved, multicast and unspecified, using a library that knows the registries. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The connection goes to the address that was validated</strong><span class="sev Critical">Critical</span><br><span class="meta">Demonstrated, not asserted. Resolving the name again when the socket opens is a second, unchecked lookup. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Redirects are disabled, or each target is fully revalidated</strong><span class="sev Critical">Critical</span><br><span class="meta">With a bounded hop count. A test must show which hop refused the request. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Authorization is a separate check that names the object</strong><span class="sev Critical">Critical</span><br><span class="meta">Quote the line. If the only check is that authentication passed, the system cannot refuse a real caller asking for someone else&#x27;s data. Source: <a href="../topics/security-foundations/index.html#reference">Security concepts for the course</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Caller identity comes from a credential, never from the network position or the presence of TLS</strong><span class="sev Critical">Critical</span><br><span class="meta">TLS authenticates the server by default. A request arriving over TLS says nothing about who sent it. Source: <a href="../topics/security-foundations/index.html#reference">Security concepts for the course</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A bound token without its proof or certificate is rejected, never downgraded</strong><span class="sev Critical">Critical</span><br><span class="meta">No fall back to bearer behaviour when the binding material is missing, including when a proxy strips the client certificate. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The proof key thumbprint is compared with the token&#x27;s cnf claim</strong><span class="sev Critical">Critical</span><br><span class="meta">A valid proof from any other key is rejected. For certificate binding, the certificate comes from the TLS layer, not a header, unless that header is proven unsettable. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Proof replay is prevented by recording jti across all instances</strong><span class="sev Critical">Critical</span><br><span class="meta">Recorded only after every other check passes. A shared store, not per-instance memory. Test replay against a second instance. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The permission filter is applied to the corpus, not the result</strong><span class="sev Critical">Critical</span><br><span class="meta">Post-filtering returns fewer results than requested, which discloses removals, and lets other tenants outrank the caller&#x27;s own documents. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every number in a retrieval response is computed after the filter</strong><span class="sev Critical">Critical</span><br><span class="meta">A total computed before it confirms that documents the caller may not read exist. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Decision-bearing retrieval excludes untrusted origins</strong><span class="sev Critical">Critical</span><br><span class="meta">Ranking adjustments do not displace a document written to win. Origin does. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The version list comes from the network and is dated</strong><span class="sev Critical">Critical</span><br><span class="meta">Every deployment that answers, not every version in the documentation. Compare the two and act on the difference. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No version answers after its sunset date</strong><span class="sev Critical">Critical</span><br><span class="meta">Or there is a dated decision recording why, owned by a named person. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Current security fixes reach every exposed version, or the version is withdrawn</strong><span class="sev Critical">Critical</span><br><span class="meta">OWASP asks for a risk analysis of older versions when a newer one adds a security improvement: backport it, or take the old version out. &quot;It is deprecated&quot; is not a remediation while it still answers. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The signature covers the timestamp as well as the body</strong><span class="sev Critical">Critical</span><br><span class="meta">Test a replay with the original timestamp and a replay with a fresh one. Both must be refused, for different reasons. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The covered timestamp is compared against a clock</strong><span class="sev Critical">Critical</span><br><span class="meta">Covering it and checking it are two separate lines. Test an event outside the window. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Event identifiers are claimed before processing, in a shared store</strong><span class="sev Critical">Critical</span><br><span class="meta">Test two concurrent copies against two instances, not two sequential requests. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The register has been reconciled against the systems, and the date is published</strong><span class="sev Critical">Critical</span><br><span class="meta">Both directions of the difference are reported. An unreconciled register is a record of what was remembered, and any clean report from it means nothing. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every credential has an owning team, never an individual</strong><span class="sev Critical">Critical</span><br><span class="meta">Reassignment is a normal operation. If the only honest answer is a person, that is the finding. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Withdrawal revokes before it deletes the record</strong><span class="sev Critical">Critical</span><br><span class="meta">Evidence that the credential is refused, dated after the revocation and before the record was removed. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Credentials stay out of URLs and telemetry</strong><span class="sev High">High</span><br><span class="meta">Reject query credentials and test every logging layer with generated test values, including failure paths. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Exposed keys can be revoked everywhere</strong><span class="sev High">High</span><br><span class="meta">Measure the revocation bound across caches and confirm the old key fails while its replacement works. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Keys have secure generation, storage, ownership, and expiry</strong><span class="sev High">High</span><br><span class="meta">Keep separate records per caller and environment; the caller retrieves the secret from a secrets manager. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Transport and credential parsing are tested end to end</strong><span class="sev High">High</span><br><span class="meta">Require HTTPS, certificate validation, and consistent rejection of missing or ambiguous credentials. Source: <a href="../topics/api-keys/index.html#reference">API keys</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Approvals are single use</strong><span class="sev High">High</span><br><span class="meta">A nonce spent on execution. An approved action happens once. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Approvals expire</strong><span class="sev High">High</span><br><span class="meta">Short enough that the approval does not outlive the context that justified it. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Downstream services authorize independently of the approval</strong><span class="sev High">High</span><br><span class="meta">OWASP&#x27;s instruction. An approval records that a human agreed, not that the caller is entitled. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Card signing canonicalizes with JCS and excludes the signatures field</strong><span class="sev High">High</span><br><span class="meta">Both are stated in section 8. Including the field makes the card unverifiable rather than weakly signed. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A card&#x27;s interface URL is on the origin that served the card</strong><span class="sev High">High</span><br><span class="meta">Or the split is a recorded decision. A signature check alone does not catch an off-origin interface. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Credentials your agent may obtain are a pre-agreed list</strong><span class="sev High">High</span><br><span class="meta">With the out-of-band path for each, so a mid-task request is matched rather than assessed on its wording. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every component the handler trusts is covered</strong><span class="sev High">High</span><br><span class="meta">Method, authority, path, content type, body digest, and the query where it carries meaning. Anything uncovered is treated as untrusted in the code, not just in the design document. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A covered component missing from the message is a rejection</strong><span class="sev High">High</span><br><span class="meta">The verifier does not substitute a blank value to complete the base. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Freshness and replay are both bounded</strong><span class="sev High">High</span><br><span class="meta">created is inside a stated window, expires is enforced when present, and nonce is recorded after verification in a store shared across instances. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Keys are bound to the payload and scoped to the caller</strong><span class="sev High">High</span><br><span class="meta">A changed payload is refused. A key from another caller is unrelated. Test both. Source: <a href="../topics/business-flows-and-idempotency/index.html#reference">Business flows and idempotency</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The stored response is replayed, including failures</strong><span class="sev High">High</span><br><span class="meta">Not recomputed. A failed operation replays as the failure it was. Source: <a href="../topics/business-flows-and-idempotency/index.html#reference">Business flows and idempotency</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Origin comparison is on the serialised form</strong><span class="sev High">High</span><br><span class="meta">Byte for byte, no trailing slash, scheme and port included. Test the same host over http and with a trailing slash. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Vary: Origin is sent wherever the response depends on the origin</strong><span class="sev High">High</span><br><span class="meta">Otherwise a shared cache can serve one origin&#x27;s allowed response to another. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The Origin header is never used as an authorisation decision</strong><span class="sev High">High</span><br><span class="meta">A non-browser client sets it freely. It is attacker input outside a browser. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The sinks a prompt reaches are enumerated</strong><span class="sev High">High</span><br><span class="meta">Request, logs, traces, caches, provider. Marked with which are yours and which have redaction before writing. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Redaction patterns are validated and tested both ways</strong><span class="sev High">High</span><br><span class="meta">With a check digit where one exists, a true positive, a false positive and an alternative format per pattern. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Prompt caching is treated as a data store</strong><span class="sev High">High</span><br><span class="meta">A cache that compares prompts stores prompts, with whatever was in them. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every exchange states audience and scope, and the server refuses without them</strong><span class="sev High">High</span><br><span class="meta">Both are OPTIONAL in the specification. Defaulting to the subject token&#x27;s scope copies everything. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>may_act is enforced, matched on issuer and subject together</strong><span class="sev High">High</span><br><span class="meta">A sub is only guaranteed unique within its issuer. Include a same-sub, different-issuer case in the test. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Issued lifetimes are capped at the subject token&#x27;s remaining life</strong><span class="sev High">High</span><br><span class="meta">Nothing in RFC 8693 caps it. A revoked session cannot recall tokens already minted from it. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Unanswered questions are reported with the severity their rule carries</strong><span class="sev High">High</span><br><span class="meta">Not downgraded for uncertainty, which would make the review quieter the less it knows. Source: <a href="../topics/design-review/index.html#reference">Design review</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The report states coverage: concluded, clean, blocked</strong><span class="sev High">High</span><br><span class="meta">A reader assumes anything unmentioned was assessed and fine. Source: <a href="../topics/design-review/index.html#reference">Design review</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Non-production deployments hold no production data and are not publicly reachable</strong><span class="sev High">High</span><br><span class="meta">Or they carry production controls, which OWASP states as the alternative. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every reachable non-current version has a retirement date</strong><span class="sev High">High</span><br><span class="meta">Reachability is the test, not whether the gateway routes to it. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Service-to-service calls, batch jobs and operator tooling carry their own credentials</strong><span class="sev High">High</span><br><span class="meta">Network position is not a credential. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Timestamps are bounded and nonces are rejected on reuse</strong><span class="sev High">High</span><br><span class="meta">The nonce is recorded only after the signature verifies. The cache TTL is at least the time window. Source: <a href="../topics/hmac-request-signing/index.html#reference">HMAC request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Signatures are compared in constant time</strong><span class="sev High">High</span><br><span class="meta">Use a library function built for this, not string equality. Source: <a href="../topics/hmac-request-signing/index.html#reference">HMAC request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Keys are per partner, at least 32 bytes, and rotated with an overlap</strong><span class="sev High">High</span><br><span class="meta">Both sides store keys in a secrets manager. Retired keys are rejected after the overlap ends. Source: <a href="../topics/hmac-request-signing/index.html#reference">HMAC request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>An unknown kid cannot drive a fetch storm</strong><span class="sev High">High</span><br><span class="meta">One bounded refresh, concurrent misses coalesced, a cooldown enforced. Test with a stream of invented key identifiers. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A kid matching more than one eligible key is rejected as ambiguous</strong><span class="sev High">High</span><br><span class="meta">No selection by array order. Keys are also filtered by use and by the algorithms the profile allows. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The revocation bound is documented as a sum and measured end to end</strong><span class="sev High">High</span><br><span class="meta">Token lifetime plus key cache age plus introspection cache TTL plus any gateway cache. Disable an account and time how long requests keep succeeding. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The token profile is declared, and every required claim is checked for presence before use</strong><span class="sev High">High</span><br><span class="meta">Name the profile, such as RFC 9068 for OAuth access tokens. A token missing any required claim is rejected rather than defaulted. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Different kinds of JWT from the same issuer have mutually exclusive validation rules</strong><span class="sev High">High</span><br><span class="meta">An ID token is rejected where an access token is expected, and the reverse. Token type or an equivalent claim is checked. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Issuer and time claims are validated with a documented leeway</strong><span class="sev High">High</span><br><span class="meta">iss matches exactly, the key belongs to that issuer, and exp, nbf and iat are checked against server time. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Clients send the resource parameter with a canonical URI</strong><span class="sev High">High</span><br><span class="meta">In both the authorization and token requests, whether or not the authorization server honours it. No fragment, no trailing slash. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The iss parameter is compared as a simple string</strong><span class="sev High">High</span><br><span class="meta">Against an issuer recorded before the redirect, with no case folding, port elision, trailing-slash or percent-encoding normalisation applied first. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>scopes_supported is the minimal set, and challenges carry a scope</strong><span class="sev High">High</span><br><span class="meta">A challenge with no scope sends a correct client to request the entire published catalogue. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Authorization codes are single use, short lived, and bound to client and redirect URI</strong><span class="sev High">High</span><br><span class="meta">A second redemption is denied and revokes tokens already issued from that code. Test the replay path, not just the happy path. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Resource servers validate the token audience and the scope for the operation</strong><span class="sev High">High</span><br><span class="meta">A token issued for one resource server is rejected by another. A valid token is not permission for every operation its scope touches. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Service-to-service clients have their own identity, narrow scopes, and no refresh token</strong><span class="sev High">High</span><br><span class="meta">One registration per service and environment. The client secret or key comes from an approved runtime secret mechanism. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Related and embedded objects are checked in their own handlers</strong><span class="sev High">High</span><br><span class="meta">Test each referenced object directly as a second caller. Reaching it through an object you own does not make it yours. Source: <a href="../topics/object-level-authorization/index.html#reference">Object-level authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A second authenticated caller is refused, and there is a test that proves it</strong><span class="sev High">High</span><br><span class="meta">Per object type, in the build, and a failure stops the deployment. Source: <a href="../topics/object-level-authorization/index.html#reference">Object-level authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Untrusted content is fenced with a per-request nonce</strong><span class="sev High">High</span><br><span class="meta">A fixed delimiter is a string the document can contain, and then the content after it reads as though it came from you. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Argument names and values are validated per tool</strong><span class="sev High">High</span><br><span class="meta">An allowed tool with an unchecked amount is an allowed tool with an unbounded amount. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The agent&#x27;s scope is the narrowest the task needs</strong><span class="sev High">High</span><br><span class="meta">State what a successful injection would reach with the current scope. That sentence is the risk. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Responses are built from a declared field list</strong><span class="sev High">High</span><br><span class="meta">No generic serialiser. Adding a column to the table changes no response, and a test proves it. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Readable and writable are two separate lists</strong><span class="sev High">High</span><br><span class="meta">Confirm the endpoint has both and that neither is derived from the other. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The object check is still present on these requests</strong><span class="sev High">High</span><br><span class="meta">A writable field on another customer&#x27;s record is refused. Property authorization does not look at owners. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The worst-case burst is written down and matches the algorithm</strong><span class="sev High">High</span><br><span class="meta">A fixed window permits twice the limit across its boundary. A token bucket permits its capacity. Test the boundary. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Expensive operations are limited by cost, not by request count</strong><span class="sev High">High</span><br><span class="meta">Or there is a measurement showing operations cost about the same. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A quota exists beside the rate</strong><span class="sev High">High</span><br><span class="meta">A per-minute limit does not bound a day. One request a second is 86,400 with nothing refused. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every paid integration has a spending limit or a billing alert</strong><span class="sev High">High</span><br><span class="meta">And somebody receives the alert. OWASP lists this as its own prevention item. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The parser refuses NaN and Infinity</strong><span class="sev High">High</span><br><span class="meta">Neither is valid JSON. Python&#x27;s json module accepts them by default. Check your library&#x27;s default and use its strict setting. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every numeric field has an explicit range</strong><span class="sev High">High</span><br><span class="meta">The grammar bounds neither magnitude nor digit count. Test a value that becomes infinity. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Either one component parses the request, or they demonstrably agree</strong><span class="sev High">High</span><br><span class="meta">Gateway and service, validator and handler, or two languages. Test the same body through each. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Host normalisation covers every spelling of an address</strong><span class="sev High">High</span><br><span class="meta">Decimal, hexadecimal, octal and IPv4-mapped IPv6, with the base decided by the prefix. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Schemes and hosts are allowlisted, hosts by exact match</strong><span class="sev High">High</span><br><span class="meta">Suffix matching is the subdomain bypass expressed as a rule. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Responses have size limits, timeouts and parsing limits</strong><span class="sev High">High</span><br><span class="meta">A response is input. Any URL inside it is a caller-supplied URL. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Body integrity is carried inside something keyed</strong><span class="sev High">High</span><br><span class="meta">A hash beside the data it describes is not integrity protection. It must be covered by a signature or carried in a token. Source: <a href="../topics/security-foundations/index.html#reference">Security concepts for the course</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The last TLS termination before the service is named, and what crosses it is stated</strong><span class="sev High">High</span><br><span class="meta">Anything past it is a separate trust relationship whether or not it was designed as one. Source: <a href="../topics/security-foundations/index.html#reference">Security concepts for the course</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every check sits on the boundary it is relied on for</strong><span class="sev High">High</span><br><span class="meta">Enumerate the paths that reach the handler and confirm each one crosses it. A gateway check with a second path around it is not a control. Source: <a href="../topics/security-foundations/index.html#reference">Security concepts for the course</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Proofs are bound to the request and the token</strong><span class="sev High">High</span><br><span class="meta">htm, htu and ath are all checked. Test a proof from a different endpoint and a proof paired with a different token. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The proof time window is short and documented</strong><span class="sev High">High</span><br><span class="meta">Stated in seconds, enforced in both directions, and understood as the replay window for anything not recorded. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Client private keys are stored at least as well as the tokens they replace</strong><span class="sev High">High</span><br><span class="meta">Non-exportable or hardware-backed where the platform allows. Binding converts token theft into key theft. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every document carries an origin recorded at ingestion</strong><span class="sev High">High</span><br><span class="meta">It cannot be recovered later, and the other controls depend on it. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every memory write records its source document and origin</strong><span class="sev High">High</span><br><span class="meta">A memory without provenance cannot be judged, found or cleaned up. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Withdrawing a document triggers a memory sweep</strong><span class="sev High">High</span><br><span class="meta">The claim leaves the index before the document does. Deletion alone is not remediation. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every write route into the index is enumerated and reviewed</strong><span class="sev High">High</span><br><span class="meta">An upload form that feeds retrieval is an authorization decision. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every superseded version has both dates, in the required order</strong><span class="sev High">High</span><br><span class="meta">RFC 9745 forbids a sunset earlier than the deprecation. Check it in the build; the two dates usually come from different people. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Deprecated versions emit Deprecation, Sunset and a Link</strong><span class="sev High">High</span><br><span class="meta">Verified against a live response, not a design document. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Remaining callers are named for every version with traffic</strong><span class="sev High">High</span><br><span class="meta">A version with traffic and no identified callers cannot be withdrawn, which is why it never is. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>A duplicate gets the same response as the original</strong><span class="sev High">High</span><br><span class="meta">RFC 8935 requires it. A different response breaks honest retries and reveals which identifiers exist. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Size limits and parsing limits apply before the signature check</strong><span class="sev High">High</span><br><span class="meta">The endpoint is unauthenticated until the signature verifies, so the parser meets attacker input first. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>One secret per sender, rotatable with an overlap</strong><span class="sev High">High</span><br><span class="meta">A shared secret lets any sender forge as another. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every credential has a rotation interval and a last-rotated date</strong><span class="sev High">High</span><br><span class="meta">Both halves. Overdue ones are named and assigned, not counted. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every credential has a revocation route that someone has executed</strong><span class="sev High">High</span><br><span class="meta">Tested on a credential you can afford to lose, before you need it on one you cannot. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Every credential has a retirement condition recorded at issue</strong><span class="sev High">High</span><br><span class="meta">A date or a named event. Pilots, migrations and single-partner integrations get the end of that thing. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Session-wide approvals are recorded with the fields they constrain</strong><span class="sev Medium">Medium</span><br><span class="meta">Zero is a legitimate answer and a legitimate finding. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The list of actions requiring approval is written down</strong><span class="sev Medium">Medium</span><br><span class="meta">Derived from what each action does rather than from how often it happens. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Approved and executed parameters are both logged</strong><span class="sev Medium">Medium</span><br><span class="meta">So an incident can answer whether they were the same without rebuilding the state. Source: <a href="../topics/agent-authority-and-approvals/index.html#reference">Agent authority and approvals</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Declared skills are compared with the skills the endpoint answers</strong><span class="sev Medium">Medium</span><br><span class="meta">The undeclared one is the one with no review behind it. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The public agent card contains nothing you would not publish</strong><span class="sev Medium">Medium</span><br><span class="meta">Sensitive detail moves behind an authenticated extended card, and the card endpoint is access-controlled if its content warrants it. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The targeted protocol version is recorded and reviewed</strong><span class="sev Medium">Medium</span><br><span class="meta">A2A is versioned and still moving. A review against an older version can be wrong rather than merely stale. Source: <a href="../topics/agent-to-agent/index.html#reference">Agent-to-agent</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Key rotation works without a cutover</strong><span class="sev Medium">Medium</span><br><span class="meta">A new keyid per key, both accepted during an overlap, and the retirement date recorded. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The choice of symmetric or asymmetric is written down with its reason</strong><span class="sev Medium">Medium</span><br><span class="meta">If an HMAC is still in use, the threat model states that a breached receiver forging as the caller is accepted. Source: <a href="../topics/asymmetric-request-signing/index.html#reference">Asymmetric request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Key retention is documented and matches the published retry schedule</strong><span class="sev Medium">Medium</span><br><span class="meta">After the retention window a retry is a new operation, so the two numbers have to agree. Source: <a href="../topics/business-flows-and-idempotency/index.html#reference">Business flows and idempotency</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The idempotency key is logged with each request</strong><span class="sev Medium">Medium</span><br><span class="meta">Repeats of one key and many distinct keys are different defects. Logging the key makes that a query. Source: <a href="../topics/business-flows-and-idempotency/index.html#reference">Business flows and idempotency</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Authorization is named in the preflight response</strong><span class="sev Medium">Medium</span><br><span class="meta">It is the one non-wildcard request-header name, so Access-Control-Allow-Headers: * does not cover it and neither does a cached * entry. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Access-Control-Max-Age is set deliberately and bounded</strong><span class="sev Medium">Medium</span><br><span class="meta">It defaults to 5 seconds and browsers clamp it. The value is how long a tightened policy keeps being ignored. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Preflight responses are asserted in tests, not confirmed by hand</strong><span class="sev Medium">Medium</span><br><span class="meta">Include a method the endpoint does not support, a request carrying Authorization, and a preflight answered with a redirect. Source: <a href="../topics/cors/index.html#reference">CORS</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Prompt and response logging is deliberate, with a retention period</strong><span class="sev Medium">Medium</span><br><span class="meta">On for a stated reason rather than because the SDK defaulted to it. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Provider retention and training terms are recorded and dated</strong><span class="sev Medium">Medium</span><br><span class="meta">A contractual fact that changes, not a property of your code. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No system prompt is load-bearing for a security decision</strong><span class="sev Medium">Medium</span><br><span class="meta">OWASP: it is neither a secret nor a security control, and privilege separation happens deterministically outside the model. Source: <a href="../topics/data-in-model-context/index.html#reference">Data in model context</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Delegation chain depth is bounded</strong><span class="sev Medium">Medium</span><br><span class="meta">And the bound is small enough that exceeding it is a design question rather than an alert. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Access logs record the subject and the current actor separately</strong><span class="sev Medium">Medium</span><br><span class="meta">An incident needs to suspend one agent without suspending the user. Source: <a href="../topics/delegation-and-token-exchange/index.html#reference">Delegation and token exchange</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Findings are ordered worst first and grouped by origin</strong><span class="sev Medium">Medium</span><br><span class="meta">Several findings in one area are usually one finding about that area. Source: <a href="../topics/design-review/index.html#reference">Design review</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Each open item is marked as a setting or a decision</strong><span class="sev Medium">Medium</span><br><span class="meta">The decisions are the ones still open next quarter. Name them on day one. Source: <a href="../topics/design-review/index.html#reference">Design review</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The rule table and the review date are version controlled</strong><span class="sev Medium">Medium</span><br><span class="meta">So the next review of the same system is a diff rather than a repeat. Source: <a href="../topics/design-review/index.html#reference">Design review</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Each gateway control is recorded as present or absent per path</strong><span class="sev Medium">Medium</span><br><span class="meta">Schema validation, size limits, rate limits and logging are absent on any path that skips the gateway. Say so explicitly. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Services log requests themselves</strong><span class="sev Medium">Medium</span><br><span class="meta">Otherwise the traffic that bypassed the gateway is also the traffic that left no record. Source: <a href="../topics/gateway-enforcement/index.html#reference">Gateway enforcement</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Intermediaries do not alter signed components</strong><span class="sev Medium">Medium</span><br><span class="meta">Gateway and proxy behavior is tested with signed requests end to end. Source: <a href="../topics/hmac-request-signing/index.html#reference">HMAC request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The shared-secret limitation is accepted in the threat model</strong><span class="sev Medium">Medium</span><br><span class="meta">Otherwise use asymmetric request signatures. Source: <a href="../topics/hmac-request-signing/index.html#reference">HMAC request signing</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Introspection caching states its blind window</strong><span class="sev Medium">Medium</span><br><span class="meta">A cached response is not used beyond its exp. The window during which a revoked token still works is written down and accepted. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Key set retrieval is over TLS with certificate validation, and failures are alerted</strong><span class="sev Medium">Medium</span><br><span class="meta">A key endpoint that has been unreachable for longer than the maximum age is a security event, not just a latency blip. Source: <a href="../topics/jwks-and-revocation/index.html#reference">JWKS, revocation and introspection</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Rejection responses do not say which check failed</strong><span class="sev Medium">Medium</span><br><span class="meta">Callers get 401. The specific reason is logged internally with a correlation ID. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Library defaults have been read, not assumed</strong><span class="sev Medium">Medium</span><br><span class="meta">Confirm what your JWT library validates by default, and configure algorithms, audience and issuer explicitly. Test the negative cases against your own configuration. Source: <a href="../topics/jwt-validation/index.html#reference">JWT validation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The targeted protocol revision is recorded and reviewed</strong><span class="sev Medium">Medium</span><br><span class="meta">MCP revisions are dated and change on backwards incompatible changes. A review against an older revision can be wrong rather than merely stale. Source: <a href="../topics/mcp-server-authorization/index.html#reference">MCP server authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>An access token is never treated as proof of user identity</strong><span class="sev Medium">Medium</span><br><span class="meta">Sign-in uses standardized user authentication. ID tokens are not sent to resource servers, and access tokens do not create sessions. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Token endpoint errors use the defined codes and leak nothing else</strong><span class="sev Medium">Medium</span><br><span class="meta">Responses do not reveal which check failed, whether a client exists, or whether a code was valid but expired. Source: <a href="../topics/oauth-basics/index.html#reference">OAuth basics</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Refusals do not disclose existence</strong><span class="sev Medium">Medium</span><br><span class="meta">The same status and body whether the object exists or not, consistently across the service, unless an exception is documented. Source: <a href="../topics/object-level-authorization/index.html#reference">Object-level authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Identifiers are unguessable, and nothing depends on that</strong><span class="sev Medium">Medium</span><br><span class="meta">Random values raise the cost of discovery. Removing the check because identifiers are UUIDs is not a trade, it is the vulnerability. Source: <a href="../topics/object-level-authorization/index.html#reference">Object-level authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Privileged operations require human approval</strong><span class="sev Medium">Medium</span><br><span class="meta">With the list of which operations written down, and the approval bound to the parameters that will execute. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Provenance is logged with the action</strong><span class="sev Medium">Medium</span><br><span class="meta">So an incident can ask which retrieved document was in the prompt when the call was proposed. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
