<li><label><input type="checkbox"><span><strong>No input filter is reported as coverage</strong><span class="sev Medium">Medium</span><br><span class="meta">If one exists, the review records the phrasings it covers and that the list is not coverage. Source: <a href="../topics/prompt-injection-and-output-handling/index.html#reference">Prompt injection and output handling</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Ignored fields are counted and logged by name</strong><span class="sev Medium">Medium</span><br><span class="meta">Names only, never values. A body setting a non-writable field is a signal worth alerting on. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Somebody has read the route table against what each operation does</strong><span class="sev Medium">Medium</span><br><span class="meta">Deny by default does not catch a rule written with the wrong role. Source: <a href="../topics/property-and-function-authorization/index.html#reference">Property and function authorization</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Sensitive operations have their own stricter limits</strong><span class="sev Medium">Medium</span><br><span class="meta">One-time-password validation, password recovery, anything that sends a message or spends money. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Platform resource limits are set</strong><span class="sev Medium">Medium</span><br><span class="meta">Memory, CPU, processes, file descriptors and execution timeouts, so a wrong limit is not an unbounded one. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>429 responses are uncacheable and cheap</strong><span class="sev Medium">Medium</span><br><span class="meta">RFC 6585 requires they not be stored by a cache, and permits dropping instead when answering is itself the cost. Source: <a href="../topics/rate-limiting-and-cost/index.html#reference">Rate limiting and cost controls</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>String and array fields have per-field maximum lengths</strong><span class="sev Medium">Medium</span><br><span class="meta">A single global limit sized for the largest field is no limit for the rest. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Rejections name the rule and do not echo the value</strong><span class="sev Medium">Medium</span><br><span class="meta">One status, one error shape, no attacker-controlled bytes in logs or responses. Source: <a href="../topics/request-and-response-contracts/index.html#reference">Request and response contracts</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Neither responses nor refusal reasons reach the caller unchanged</strong><span class="sev Medium">Medium</span><br><span class="meta">One status, no detail. &quot;Address literal, private&quot; is a fact about your network. Source: <a href="../topics/ssrf-and-unsafe-consumption/index.html#reference">SSRF and unsafe consumption of APIs</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>For each value in a request, who can produce it and who can check it is written down</strong><span class="sev Medium">Medium</span><br><span class="meta">Where the two sets are the same, the design records that the receiver can forge and that this was accepted. Source: <a href="../topics/security-foundations/index.html#reference">Security concepts for the course</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Secrets and tags are compared in constant time</strong><span class="sev Medium">Medium</span><br><span class="meta">Library functions built for the purpose, not string equality. Functional tests pass either way. Source: <a href="../topics/security-foundations/index.html#reference">Security concepts for the course</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Binding has not displaced any existing check</strong><span class="sev Medium">Medium</span><br><span class="meta">Audience, scope, expiry, issuer and object-level authorization are all still enforced on bound tokens. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The revocation bound is unchanged and still stated</strong><span class="sev Medium">Medium</span><br><span class="meta">A bound token remains valid until it expires unless active state is consulted. Module 6&#x27;s sum still applies. Source: <a href="../topics/sender-constrained-tokens/index.html#reference">Sender-constrained tokens</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Retrieval activity is logged with a stated retention</strong><span class="sev Medium">Medium</span><br><span class="meta">OWASP asks for detailed immutable logs of retrieval activity. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No ranking adjustment is reported as a security control</strong><span class="sev Medium">Medium</span><br><span class="meta">State the margin it changes. In the lab it was 0.08 to 0.06, with the order unchanged. Source: <a href="../topics/supply-chain-retrieval-and-memory/index.html#reference">Supply chain, retrieval, and memory</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Internal and non-production versions are in the same inventory</strong><span class="sev Medium">Medium</span><br><span class="meta">These are the ones missing from the documentation, which is why they last longest. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Withdrawal is verified from the network afterwards</strong><span class="sev Medium">Medium</span><br><span class="meta">The same way reachability was established in the first place. Source: <a href="../topics/versioning-and-deprecation/index.html#reference">Versioning and deprecation</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>Handlers tolerate out-of-order delivery</strong><span class="sev Medium">Medium</span><br><span class="meta">Or the design states why order is guaranteed. Delivery is at least once and unordered. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The endpoint URL is not treated as a secret</strong><span class="sev Medium">Medium</span><br><span class="meta">And the event contents are treated as untrusted input, including any URL inside them. Source: <a href="../topics/webhooks/index.html#reference">Webhooks</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>No credential is shared across systems, and none is unused</strong><span class="sev Medium">Medium</span><br><span class="meta">One credential per system. Anything active and unused past the threshold is withdrawn or justified in writing. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
<li><label><input type="checkbox"><span><strong>The register stores no secret values, and scopes are recorded</strong><span class="sev Medium">Medium</span><br><span class="meta">Metadata only. A credential whose scope was never recorded cannot be assessed. Source: <a href="../topics/credential-lifecycle/index.html#reference">Workload and agent identity lifecycle</a>.</span></span></label></li>
</ul>
