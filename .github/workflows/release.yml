# Release gate. Runs every check the project has against a tagged commit,
# writes down what was run and what it said, and attaches that record to a
# draft release.
#
# It runs when a tag that starts with "v" is pushed. It can also be started by
# hand from the Actions tab or with `gh workflow run release.yml`: then it
# runs the same checks and keeps the record as a workflow artifact, and it
# creates no release.
#
# What it runs is tools/release_evidence.py: the checks the publishing
# workflow runs, plus two accessibility runs (the static pages and the built
# site) and a run of every lab through the button on its lesson page. Nothing
# may be skipped: a check that cannot run fails.
#
# Two jobs, on purpose. "evidence" installs packages and runs code from them,
# and it can only read the repository. "release" can write a release, and it
# runs nothing from a package: it downloads the record and attaches it.
#
# A tag needs its release notes first: release-notes/<tag>.md must exist in
# the tagged commit, or the release job fails. The release is created as a
# draft, so a person reads the record before publishing it.
#
# Every action is pinned to a commit, with its release tag in the comment.
# Python packages are pinned by hash in tools/requirements-release.txt, and
# the axe-core tarball is checked against the integrity value below.
name: Release evidence

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  AXE_CORE_VERSION: "4.13.0"
  AXE_CORE_INTEGRITY: "sha512-UzGt8zg7Ny8djbYMhxl2zuEevVa7r2gJjYY5Lwr1xM7+XU2nd6CkIWFTVcCIbAP63vSz71NaVyyuSk9lHKcy0A=="

jobs:
  evidence:
    # A named release, not ubuntu-latest: the browser install below needs
    # system packages Playwright 1.56.0 knows for this release, and the record
    # should say which system it ran on. Move it on purpose, with Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the Python packages, pinned by hash
        run: python3 -m pip install --require-hashes -r tools/requirements-release.txt

      - name: Install the browser the checks drive
        run: python3 -m playwright install --with-deps chromium

      - name: Fetch axe-core and check it is the file that was pinned
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/axe"
          cd "$RUNNER_TEMP/axe"
          npm pack "axe-core@${AXE_CORE_VERSION}" --silent
          got="sha512-$(openssl dgst -sha512 -binary "axe-core-${AXE_CORE_VERSION}.tgz" | base64 -w0)"
          if [ "$got" != "$AXE_CORE_INTEGRITY" ]; then
            echo "axe-core tarball does not match the pinned integrity value"
            echo "expected $AXE_CORE_INTEGRITY"
            echo "got      $got"
            exit 1
          fi
          tar -xzf "axe-core-${AXE_CORE_VERSION}.tgz"
          echo "AXE_CORE_PATH=$RUNNER_TEMP/axe/package/axe.min.js" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Run every check and write the record
        run: python3 tools/release_evidence.py --out evidence

      - name: Show the record
        if: always()
        run: |
          if [ -f evidence/evidence.md ]; then cat evidence/evidence.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: evidence/
          if-no-files-found: error

  release:
    needs: evidence
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence

      - name: Create a draft release with the record attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "$notes is missing. Write the release notes and tag a commit that contains them."
            exit 1
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$notes" \
            evidence/evidence.md evidence/evidence.json evidence/labs-browser.json
