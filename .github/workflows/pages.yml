# Builds the React app in app/ and publishes app/dist to GitHub Pages.
#
# The static pages in the repository stay the source of truth. This workflow
# first runs the checks on the pages and the generated files, then runs every
# lab and compares its output with the transcript its page publishes. A page
# that is stale or broken, or a lab that no longer prints what its page says,
# stops the deployment, and the site that is already live stays up.
#
# Five labs need the cryptography package. It is installed from
# tools/requirements-ci.txt with every file pinned by hash, and the transcript
# check runs with --no-skips, so a lab that could not run fails the job
# instead of being reported as skipped.
#
# Every action is pinned to a commit, with its release tag in the comment.
# Module 32 of the course says why: a tag can be moved, a commit cannot.
name: Publish the site

on:
  push:
    branches: [main]
  # The same checks on a pull request into main, without publishing, so the
  # ruleset on main can require the build job to pass before a merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One publish at a time. A pull request has its own group, so it never
  # waits behind a deployment or delays one.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check the pages and the generated files
        run: |
          python3 tools/check_site.py
          python3 tools/extract_lessons.py --check
          python3 tools/render_site.py
          python3 tools/extract_pages.py --check
          python3 tools/build_search_index.py --check
          python3 tools/build_lab_bundles.py --check
          python3 tools/build_checklist.py --check
          python3 tools/build_coverage.py --check
          python3 tools/check_applicability.py

      - name: Run every lab and compare it with its published transcript
        run: |
          python3 -m pip install --require-hashes -r tools/requirements-ci.txt
          python3 tools/check_transcripts.py --no-skips

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
